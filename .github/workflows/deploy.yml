name: Test and deploy ReadTech Companion

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The repository also has branch-based Pages enabled. Its automatic
      # publication must finish first, otherwise it can overwrite the Vite app
      # with unbuilt source. No repository settings or other sites are changed.
      - name: Wait for branch-based Pages publication
        uses: actions/github-script@v7
        with:
          script: |
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            const { data: pages } = await github.rest.repos.getPages(repo);
            if (pages.build_type === 'workflow') return;
            for (let attempt = 0; attempt < 60; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                ...repo, head_sha: context.sha, per_page: 100
              });
              const branchRun = data.workflow_runs.find(run =>
                run.path === 'dynamic/pages/pages-build-deployment' &&
                run.id !== context.runId
              );
              if (branchRun?.status === 'completed') {
                core.info('Branch publication finished; publishing the built app next.');
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            throw new Error('Branch-based Pages publication did not finish in time.');
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
